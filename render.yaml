services:
  - type: web
    name: streamflow-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: sqlite:///app/data/streamflow.db?mode=rwc
      - key: SEGMENT_CACHE_MB
        value: "64"
      - key: TOKEN_VALIDITY_SECS
        value: "3600"
      - key: HMAC_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
