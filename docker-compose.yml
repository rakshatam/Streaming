version: '3.8'

services:
  streamflow-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: streamflow-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DATABASE_URL=sqlite:///app/data/streamflow.db?mode=rwc
      - HMAC_SECRET=streamflow_hmac_secret_token_signing_2026
      - JWT_SECRET=super_secure_jwt_token_signing_secret_key_streamflow
      - SEGMENT_CACHE_MB=64
      - TOKEN_VALIDITY_SECS=3600
    volumes:
      - streamflow_data:/app/data
    networks:
      - streamflow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  streamflow-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: streamflow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      streamflow-backend:
        condition: service_healthy
    networks:
      - streamflow-net

networks:
  streamflow-net:
    driver: bridge

volumes:
  streamflow_data:
