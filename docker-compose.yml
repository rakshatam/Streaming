services:
  streamflow-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      DATABASE_URL: sqlite:///app/data/streamflow.db?mode=rwc
      HMAC_SECRET: ${HMAC_SECRET:?Set HMAC_SECRET in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      CACHE_ADMIN_TOKEN: ${CACHE_ADMIN_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SEGMENT_CACHE_MB: ${SEGMENT_CACHE_MB:-64}
      TOKEN_VALIDITY_SECS: ${TOKEN_VALIDITY_SECS:-3600}
    volumes:
      - streamflow_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  streamflow-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BACKEND_URL: http://streamflow-backend:8080
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      streamflow-backend:
        condition: service_healthy

volumes:
  streamflow_data:
